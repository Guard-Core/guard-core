worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    client_max_body_size 10m;

    # A request that carries "X-Smoke-Unlimited: 1" has an empty key, which nginx
    # does not count. Only a scenario that measures the guard under a burst sends
    # it; every other request keeps the 30 r/s limit.
    map $http_x_smoke_unlimited $smoke_limit_key {
        default $binary_remote_addr;
        "1" "";
    }

    limit_req_zone $smoke_limit_key zone=general:10m rate=30r/s;

    # A request that carries "X-Smoke-Client: <ipv4>" reaches the app as that
    # client; every other request is the default smoke client. Only a scenario
    # that needs a second client (the per-client tracking caps) sends it.
    map $http_x_smoke_client $smoke_client_ip {
        default 192.168.50.50;
        "~^\d{1,3}(\.\d{1,3}){3}$" $http_x_smoke_client;
    }

    upstream app {
        server fastapi-guard-example:8000;
    }

    server {
        listen 80;
        server_name _;

        location /health {
            proxy_pass http://app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP 192.168.50.50;
            proxy_set_header X-Forwarded-For 192.168.50.50;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ready {
            proxy_pass http://app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP 192.168.50.50;
            proxy_set_header X-Forwarded-For 192.168.50.50;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $smoke_client_ip;
            proxy_set_header X-Forwarded-For $smoke_client_ip;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Smoke-Client "";
        }

        location / {
            limit_req zone=general burst=50 nodelay;

            proxy_pass http://app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $smoke_client_ip;
            proxy_set_header X-Forwarded-For $smoke_client_ip;
            proxy_set_header X-Forwarded-Proto $scheme;
            # The header only steers nginx; an empty value drops it before the
            # app, so the pipeline never scans the steering IP as header content.
            proxy_set_header X-Smoke-Client "";

            proxy_request_buffering off;
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
