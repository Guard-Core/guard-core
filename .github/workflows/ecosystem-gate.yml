name: Ecosystem Gate

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      consumer_ref:
        description: 'Consumer ref to test against: empty = default branch HEAD, "latest-release" = latest release tag, or an explicit ref'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ecosystem-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: '3.10'
      UV_PYTHON_DOWNLOADS: never

    outputs:
      version: ${{ steps.wheel.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Packaging only (the wheel is pure Python); the consumer jobs below run it on 3.10 and 3.14.
          python-version: '3.10'

      - name: Install uv
        run: |
          pip install uv==0.13.4

      - name: Build the wheel
        run: |
          uv build --wheel --out-dir dist

      - name: Record the wheel version
        id: wheel
        run: |
          version="$(basename dist/*.whl | sed -E 's/^guard_core-([^-]+)-.*/\1/')"
          echo "Built guard_core wheel version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guard-core-wheel
          path: dist/*.whl

  consumer-test:
    needs: build-wheel
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:8.10.3@sha256:de1068af6f552240dfab67bcc9bfef99bfc60f776bb4580ef077ea4c8c97e848
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        # Each consumer runs on both interpreters; the include entries only add the per-consumer fields by name.
        name: [fastapi-guard, flaskapi-guard, djapi-guard, tornadoapi-guard, guard-agent, guard-core-mcp]
        python-version: ['3.10', '3.14']
        include:
          - name: fastapi-guard
            repo: Guard-Core/fastapi-guard
            sync_extra: '--extra dev'
            pytest_args: '-v --cov=guard --cov-branch'
            redis_prefix: 'test:fastapi_guard:'
          - name: flaskapi-guard
            repo: Guard-Core/flaskapi-guard
            sync_extra: '--extra dev'
            pytest_args: '-v --cov=flaskapi_guard'
            redis_prefix: 'test:flaskapi_guard:'
          - name: djapi-guard
            repo: Guard-Core/djapi-guard
            sync_extra: '--extra dev'
            pytest_args: '-v --cov=djangoapi_guard'
            redis_prefix: 'test:djangoapi_guard:'
          - name: tornadoapi-guard
            repo: Guard-Core/tornadoapi-guard
            sync_extra: '--extra dev'
            pytest_args: '-v --cov=tornadoapi_guard'
            redis_prefix: 'test:tornadoapi_guard:'
          - name: guard-agent
            repo: Guard-Core/guard-agent
            sync_extra: '--extra dev'
            pytest_args: '-v --cov=guard_agent'
            redis_prefix: ''
          - name: guard-core-mcp
            repo: Guard-Core/guard-core-mcp
            sync_extra: '--extra dev'
            pytest_args: '-v --cov=guard_core_mcp --cov-branch'
            redis_prefix: ''

    env:
      IPINFO_TOKEN: test_token
      REDIS_URL: redis://localhost:6379
      GH_TOKEN: ${{ github.token }}
      # The consumers' own .python-version says 3.11, so ecosystem_gate.sh syncs with this version explicitly.
      UV_PYTHON: ${{ matrix.python-version }}
      UV_PYTHON_DOWNLOADS: never
      EXPECTED_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the PR wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: guard-core-wheel
          path: dist

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          pip install uv==0.13.4

      - name: Assert uv resolves the matrix interpreter
        run: |
          uv run --no-project python -c "import os, sys; assert '%d.%d' % sys.version_info[:2] == os.environ['EXPECTED_PYTHON'], sys.version; print(sys.version)"

      # D-207 TEMPORARY 5.0.0 PINS, begin. Release-day step 3b (the gate reset PR) deletes this step and restores
      # "${{ github.event.inputs.consumer_ref }}" as the last argument below.
      - name: Pin the 5.0.0 consumer branch (D-207, temporary)
        id: pin
        env:
          DISPATCH_REF: ${{ github.event.inputs.consumer_ref }}
        run: |
          ref="$DISPATCH_REF"
          if [ -z "$ref" ]; then
            case "${{ matrix.name }}" in
              fastapi-guard|flaskapi-guard|djapi-guard|tornadoapi-guard) ref=landing-5.0.0-adapters ;;
              # guard-agent's 5.0.0 branch is landing-6b (maintainer-confirmed; the consumer suites ran on it).
              guard-agent) ref=landing-6b ;;
              guard-core-mcp) ref=landing-6 ;;
              *) echo "::error::no 5.0.0 pin for ${{ matrix.name }}"; exit 1 ;;
            esac
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      # D-207 TEMPORARY 5.0.0 PINS, end.

      - name: Test ${{ matrix.name }} against the PR wheel
        run: |
          .github/scripts/ecosystem_gate.sh \
            "${{ matrix.repo }}" \
            "${{ matrix.sync_extra }}" \
            "${{ matrix.pytest_args }}" \
            "$PWD/dist" \
            "${NEEDS_BUILD_WHEEL_OUTPUTS_VERSION}" \
            "${{ matrix.redis_prefix }}" \
            "${STEPS_PIN_OUTPUTS_REF}"
        env:
          NEEDS_BUILD_WHEEL_OUTPUTS_VERSION: ${{ needs.build-wheel.outputs.version }}
          STEPS_PIN_OUTPUTS_REF: ${{ steps.pin.outputs.ref }}

      - name: Upload pytest output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}-py${{ matrix.python-version }}-pytest-output
          path: |
            consumer/pytest-output-base.txt
            consumer/pytest-output-candidate.txt
          if-no-files-found: ignore

  consumer-test-latest-release:
    name: consumer-test-latest-release
    if: github.event_name == 'pull_request'
    needs: build-wheel
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:8.10.3@sha256:de1068af6f552240dfab67bcc9bfef99bfc60f776bb4580ef077ea4c8c97e848
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        # Each consumer runs on both interpreters; the include entries only add the per-consumer fields by name.
        name: [fastapi-guard, flaskapi-guard, djapi-guard, tornadoapi-guard, guard-agent, guard-core-mcp]
        python-version: ['3.10', '3.14']
        include:
          - name: fastapi-guard
            repo: Guard-Core/fastapi-guard
            sync_extra: '--extra dev'
            pytest_args: '-v --cov=guard --cov-branch'
            redis_prefix: 'test:fastapi_guard:'
          - name: flaskapi-guard
            repo: Guard-Core/flaskapi-guard
            sync_extra: '--extra dev'
            pytest_args: '-v --cov=flaskapi_guard'
            redis_prefix: 'test:flaskapi_guard:'
          - name: djapi-guard
            repo: Guard-Core/djapi-guard
            sync_extra: '--extra dev'
            pytest_args: '-v --cov=djangoapi_guard'
            redis_prefix: 'test:djangoapi_guard:'
          - name: tornadoapi-guard
            repo: Guard-Core/tornadoapi-guard
            sync_extra: '--extra dev'
            pytest_args: '-v --cov=tornadoapi_guard'
            redis_prefix: 'test:tornadoapi_guard:'
          - name: guard-agent
            repo: Guard-Core/guard-agent
            sync_extra: '--extra dev'
            pytest_args: '-v --cov=guard_agent'
            redis_prefix: ''
          - name: guard-core-mcp
            repo: Guard-Core/guard-core-mcp
            sync_extra: '--extra dev'
            pytest_args: '-v --cov=guard_core_mcp --cov-branch'
            redis_prefix: ''

    env:
      IPINFO_TOKEN: test_token
      REDIS_URL: redis://localhost:6379
      GH_TOKEN: ${{ github.token }}
      # The consumers' own .python-version says 3.11, so ecosystem_gate.sh syncs with this version explicitly.
      UV_PYTHON: ${{ matrix.python-version }}
      UV_PYTHON_DOWNLOADS: never
      EXPECTED_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the PR wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: guard-core-wheel
          path: dist

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          pip install uv==0.13.4

      - name: Assert uv resolves the matrix interpreter
        run: |
          uv run --no-project python -c "import os, sys; assert '%d.%d' % sys.version_info[:2] == os.environ['EXPECTED_PYTHON'], sys.version; print(sys.version)"

      - name: Test ${{ matrix.name }} against the PR wheel (latest-release)
        run: |
          .github/scripts/ecosystem_gate.sh \
            "${{ matrix.repo }}" \
            "${{ matrix.sync_extra }}" \
            "${{ matrix.pytest_args }}" \
            "$PWD/dist" \
            "${NEEDS_BUILD_WHEEL_OUTPUTS_VERSION}" \
            "${{ matrix.redis_prefix }}" \
            "latest-release"
        env:
          NEEDS_BUILD_WHEEL_OUTPUTS_VERSION: ${{ needs.build-wheel.outputs.version }}

      - name: Upload pytest output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}-latest-release-py${{ matrix.python-version }}-pytest-output
          path: |
            consumer/pytest-output-base.txt
            consumer/pytest-output-candidate.txt
          if-no-files-found: ignore

  ecosystem-gate:
    name: ecosystem-gate
    runs-on: ubuntu-latest
    needs: [consumer-test, consumer-test-latest-release]
    if: always()
    steps:
      - name: Fail when any consumer job failed
        run: |
          if [ "${{ needs.consumer-test.result }}" != "success" ]; then
            echo "::error::consumer-test result: ${{ needs.consumer-test.result }}"
            exit 1
          fi
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ needs.consumer-test-latest-release.result }}" != "success" ]; then
            echo "::error::consumer-test-latest-release result: ${{ needs.consumer-test-latest-release.result }}"
            exit 1
          fi
          echo "all consumer jobs passed"
