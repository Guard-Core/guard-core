name: Detection Gate

on:
  push:
    branches:
      - master
    paths:
      - 'guard_core/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'Dockerfile'
      - '.github/workflows/detection-gate.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'guard_core/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'Dockerfile'
      - '.github/workflows/detection-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detection-gate-shards:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: builtin-safety
            pytest_args: >-
              tests/test_detection/test_builtin_pattern_safety.py
              tests/test_sync/test_detection/test_builtin_pattern_safety.py
          - name: hardening-canaries
            pytest_args: >-
              tests/test_sus_patterns/test_custom_redos_hardening.py
              tests/test_sync/test_sus_patterns/test_custom_redos_hardening.py
          - name: arbiter-grammar
            pytest_args: >-
              tests/test_sus_patterns/test_redos_cost_arbiter.py
              tests/test_sync/test_sus_patterns/test_redos_cost_arbiter.py
          - name: benchmarks-and-rest
            pytest_args: >-
              tests
              --ignore=tests/test_detection/test_builtin_pattern_safety.py
              --ignore=tests/test_sync/test_detection/test_builtin_pattern_safety.py
              --ignore=tests/test_sus_patterns/test_custom_redos_hardening.py
              --ignore=tests/test_sync/test_sus_patterns/test_custom_redos_hardening.py
              --ignore=tests/test_sus_patterns/test_redos_cost_arbiter.py
              --ignore=tests/test_sync/test_sus_patterns/test_redos_cost_arbiter.py

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install uv
        run: |
          pip install uv

      - name: Install dependencies (same extras as the Dockerfile)
        run: |
          uv sync --extra dev --extra otel --extra logfire

      - name: Fail on generated sync-tree drift
        run: |
          uv run python scripts/unasync.py --check

      - name: Run the detection gate suite (shard)
        shell: bash
        run: |
          REDIS_URL='redis://localhost:6379' \
          GUARD_TESTS_MAX_TEST_SECONDS=300 \
          uv run pytest -m 'redos_timing' -s -v --no-cov ${{ matrix.shard.pytest_args }} 2>&1 | tee "detection-report-${{ matrix.shard.name }}.txt"

      - name: Upload the shard report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: detection-report-${{ matrix.shard.name }}
          path: "detection-report-${{ matrix.shard.name }}.txt"
          if-no-files-found: ignore

  detection-gate:
    name: detection-gate
    needs: detection-gate-shards
    if: always()
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download the shard reports
        uses: actions/download-artifact@v8
        with:
          pattern: detection-report-*
          path: reports

      - name: Build the PR comment body from the shard reports
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        env:
          JOB_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHARD_RESULT: ${{ needs.detection-gate-shards.result }}
        run: |
          python3 .github/scripts/assemble_detection_gate_comment.py reports detection-comment.md

      - name: Post the report on the PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ ! -f detection-comment.md ]; then
            echo "::warning::detection-comment.md was not built; skipping the PR comment"
            exit 0
          fi
          marker='<!-- detection-gate-report -->'
          cat > minimize.graphql <<'GRAPHQL'
          mutation($id: ID!) { minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) { minimizedComment { isMinimized } } }
          GRAPHQL
          for node_id in $(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate --jq ".[] | select(.body | contains(\"$marker\")) | .node_id"); do
            gh api graphql -F query=@minimize.graphql -F id="$node_id" > /dev/null
          done
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file detection-comment.md

      - name: Fail when any shard failed
        if: always()
        run: |
          if [ "${{ needs.detection-gate-shards.result }}" != "success" ]; then
            echo "::error::detection-gate-shards result: ${{ needs.detection-gate-shards.result }}"
            exit 1
          fi
          echo "all detection gate shards passed"

  detection-gate-cpu-load-shards:
    name: detection-gate-cpu-load
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: builtin-safety
            pytest_args: >-
              tests/test_detection/test_builtin_pattern_safety.py
              tests/test_sync/test_detection/test_builtin_pattern_safety.py
          - name: hardening-canaries
            pytest_args: >-
              tests/test_sus_patterns/test_custom_redos_hardening.py
              tests/test_sync/test_sus_patterns/test_custom_redos_hardening.py
          - name: arbiter-grammar
            pytest_args: >-
              tests/test_sus_patterns/test_redos_cost_arbiter.py
              tests/test_sync/test_sus_patterns/test_redos_cost_arbiter.py
          - name: benchmarks-and-rest
            pytest_args: >-
              tests
              --ignore=tests/test_detection/test_builtin_pattern_safety.py
              --ignore=tests/test_sync/test_detection/test_builtin_pattern_safety.py
              --ignore=tests/test_sus_patterns/test_custom_redos_hardening.py
              --ignore=tests/test_sync/test_sus_patterns/test_custom_redos_hardening.py
              --ignore=tests/test_sus_patterns/test_redos_cost_arbiter.py
              --ignore=tests/test_sync/test_sus_patterns/test_redos_cost_arbiter.py

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install uv
        run: |
          pip install uv

      - name: Install dependencies (same extras as the Dockerfile)
        run: |
          uv sync --extra dev --extra otel --extra logfire

      - name: Start a CPU burner on every core
        run: |
          : > burner_pids.txt
          for _ in $(seq 1 "$(nproc)"); do
            python3 -c "while True: pass" &
            echo $! >> burner_pids.txt
          done

      - name: Run the detection gate suite under CPU load (shard)
        shell: bash
        run: |
          # Measuring a genuinely quadratic pattern under burners is real
          # work: with the load-scaled verdict deadline the cap-aware
          # canaries legitimately take ~380s per test on a 4-core runner,
          # so this job's per-test ceiling sits above the plain gate's.
          # The ceiling guards hung tests, not load-scaled verdicts.
          REDIS_URL='redis://localhost:6379' \
          GUARD_TESTS_MAX_TEST_SECONDS=600 \
          uv run pytest -m 'redos_timing' -s -v --no-cov ${{ matrix.shard.pytest_args }} 2>&1 | tee "detection-report-cpu-load-${{ matrix.shard.name }}.txt"

      - name: Stop the CPU burner
        if: always()
        run: |
          while read -r pid; do
            kill "$pid" 2>/dev/null || true
          done < burner_pids.txt

      - name: Upload the CPU-load shard report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: detection-report-cpu-load-${{ matrix.shard.name }}
          path: "detection-report-cpu-load-${{ matrix.shard.name }}.txt"
          if-no-files-found: ignore

  detection-gate-cpu-load:
    name: detection-gate-cpu-load
    needs: detection-gate-cpu-load-shards
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Fail when any shard failed
        run: |
          if [ "${{ needs.detection-gate-cpu-load-shards.result }}" != "success" ]; then
            echo "::error::detection-gate-cpu-load-shards result: ${{ needs.detection-gate-cpu-load-shards.result }}"
            exit 1
          fi
          echo "all CPU-load detection gate shards passed"

  detection-corpus:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install uv
        run: |
          pip install uv

      - name: Check out base tree at merge-base
        run: |
          git fetch origin master
          base_sha=$(git merge-base HEAD origin/master)
          echo "base_sha=$base_sha"
          git worktree add /tmp/base-tree "$base_sha"

      - name: Install dependencies
        run: |
          uv sync --extra dev --extra otel --extra logfire

      - name: Print guard_core.__file__ (candidate)
        run: |
          uv run python -c "import guard_core; print(guard_core.__file__)"

      - name: Measure candidate corpus
        run: |
          uv run python tests/detection_gate/defect_corpus.py "$PWD" "/tmp/base-tree" > dc_cand.json

      - name: Measure base corpus
        run: |
          uv run python tests/detection_gate/defect_corpus.py "/tmp/base-tree" "/tmp/base-tree" > dc_base.json

      - name: Run the detection corpus gate
        shell: bash
        run: |
          set -o pipefail
          uv run python tests/detection_gate/gate.py dc_base.json dc_cand.json "$PWD" 2>&1 | tee gate-output.txt

      - name: Upload gate artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: detection-corpus-gate
          path: |
            dc_base.json
            dc_cand.json
            gate-output.txt
