name: Detection Gate

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # pull_request checks out the merge commit; the second commit is the base (its first parent).
          fetch-depth: 2

      - name: Decide whether any code path changed
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # On pull_request the checkout is the merge commit: HEAD^1 is the base, so a depth-1 clone cannot answer.
          if ! files="$(git diff --name-only HEAD^1 HEAD)"; then
            echo "::error::cannot diff HEAD^1 HEAD (shallow or non-merge checkout), refusing to guess"
            exit 1
          fi
          code=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              docs/*|mkdocs.yml|.github/ISSUE_TEMPLATE/*) ;;
              */*) code=true; echo "code path: $f" ;;
              *.md|LICENSE) ;;
              *) code=true; echo "code path: $f" ;;
            esac
          done <<< "$files"
          echo "changed files: $(printf '%s' "$files" | wc -l | tr -d ' ')"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  detection-gate-shards:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      # uv follows .python-version (3.10) unless told otherwise.
      UV_PYTHON: ${{ matrix.python-version }}
      UV_PYTHON_DOWNLOADS: never
      EXPECTED_PYTHON: ${{ matrix.python-version }}

    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
        shard:
          - name: builtin-safety
            pytest_args: >-
              tests/test_detection/test_builtin_pattern_safety.py
              tests/test_sync/test_detection/test_builtin_pattern_safety.py
          - name: hardening-canaries
            pytest_args: >-
              tests/test_sus_patterns/test_custom_redos_hardening.py
              tests/test_sync/test_sus_patterns/test_custom_redos_hardening.py
          - name: arbiter-grammar
            pytest_args: >-
              tests/test_sus_patterns/test_redos_cost_arbiter.py
              tests/test_sync/test_sus_patterns/test_redos_cost_arbiter.py
          - name: benchmarks-and-rest
            pytest_args: >-
              tests
              --ignore=tests/test_detection/test_builtin_pattern_safety.py
              --ignore=tests/test_sync/test_detection/test_builtin_pattern_safety.py
              --ignore=tests/test_sus_patterns/test_custom_redos_hardening.py
              --ignore=tests/test_sync/test_sus_patterns/test_custom_redos_hardening.py
              --ignore=tests/test_sus_patterns/test_redos_cost_arbiter.py
              --ignore=tests/test_sync/test_sus_patterns/test_redos_cost_arbiter.py

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          pip install uv

      - name: Assert uv resolves the matrix interpreter (before sync)
        run: |
          uv run --no-project python -c "import os, sys; assert '%d.%d' % sys.version_info[:2] == os.environ['EXPECTED_PYTHON'], sys.version; print(sys.version)"

      - name: Install dependencies (same extras as the Dockerfile)
        run: |
          uv sync --locked --extra dev --extra otel --extra logfire

      - name: Assert the synced environment runs the matrix interpreter
        run: |
          uv run --no-sync python -c "import os, sys; assert '%d.%d' % sys.version_info[:2] == os.environ['EXPECTED_PYTHON'], sys.version; print(sys.version)"

      - name: Fail on generated sync-tree drift
        run: |
          uv run --no-sync python scripts/unasync.py --check

      - name: Run the detection gate suite (shard)
        shell: bash
        run: |
          REDIS_URL='redis://localhost:6379' \
          GUARD_TESTS_MAX_TEST_SECONDS=300 \
          uv run pytest -m 'redos_timing' -s -v --no-cov ${{ matrix.shard.pytest_args }} 2>&1 | tee "detection-report-py${{ matrix.python-version }}-${{ matrix.shard.name }}.txt"

      - name: Upload the shard report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: detection-report-py${{ matrix.python-version }}-${{ matrix.shard.name }}
          path: "detection-report-py${{ matrix.python-version }}-${{ matrix.shard.name }}.txt"
          if-no-files-found: ignore

  detection-gate:
    name: detection-gate
    needs: [changes, detection-gate-shards]
    if: always()
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download the shard reports
        if: needs.changes.outputs.code == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: detection-report-*
          path: reports

      - name: Build the PR comment body from the shard reports
        if: always() && github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
        continue-on-error: true
        shell: bash
        env:
          JOB_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHARD_RESULT: ${{ needs.detection-gate-shards.result }}
        run: |
          python3 .github/scripts/assemble_detection_gate_comment.py reports detection-comment.md

      - name: Post the report on the PR
        if: always() && github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ ! -f detection-comment.md ]; then
            echo "::warning::detection-comment.md was not built; skipping the PR comment"
            exit 0
          fi
          marker='<!-- detection-gate-report -->'
          cat > minimize.graphql <<'GRAPHQL'
          mutation($id: ID!) { minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) { minimizedComment { isMinimized } } }
          GRAPHQL
          for node_id in $(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate --jq ".[] | select(.body | contains(\"$marker\")) | .node_id"); do
            gh api graphql -F query=@minimize.graphql -F id="$node_id" > /dev/null
          done
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file detection-comment.md

      - name: Require every gating job
        if: always()
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::changes: $CHANGES_RESULT"
            exit 1
          fi
          case "$CODE" in
            true) accepted='["success"]' ;;
            false) accepted='["success","skipped"]' ;;
            *) echo "::error::changes output code is '$CODE', expected true or false"; exit 1 ;;
          esac
          bad="$(jq -r --argjson ok "$accepted" 'del(.changes) | to_entries[] | select(.value.result as $r | $ok | index($r) | not) | "\(.key)=\(.value.result)"' <<< "$NEEDS")"
          if [ -n "$bad" ]; then
            echo "::error::not green: $bad"
            exit 1
          fi
          echo "every gating job is green (code=$CODE)"

  detection-gate-cpu-load-shards:
    name: detection-gate-cpu-load
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      # uv follows .python-version (3.10) unless told otherwise.
      UV_PYTHON: ${{ matrix.python-version }}
      UV_PYTHON_DOWNLOADS: never
      EXPECTED_PYTHON: ${{ matrix.python-version }}

    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
        shard:
          - name: builtin-safety
            pytest_args: >-
              tests/test_detection/test_builtin_pattern_safety.py
              tests/test_sync/test_detection/test_builtin_pattern_safety.py
          - name: hardening-canaries
            pytest_args: >-
              tests/test_sus_patterns/test_custom_redos_hardening.py
              tests/test_sync/test_sus_patterns/test_custom_redos_hardening.py
          - name: arbiter-grammar
            pytest_args: >-
              tests/test_sus_patterns/test_redos_cost_arbiter.py
              tests/test_sync/test_sus_patterns/test_redos_cost_arbiter.py
          - name: benchmarks-and-rest
            pytest_args: >-
              tests
              --ignore=tests/test_detection/test_builtin_pattern_safety.py
              --ignore=tests/test_sync/test_detection/test_builtin_pattern_safety.py
              --ignore=tests/test_sus_patterns/test_custom_redos_hardening.py
              --ignore=tests/test_sync/test_sus_patterns/test_custom_redos_hardening.py
              --ignore=tests/test_sus_patterns/test_redos_cost_arbiter.py
              --ignore=tests/test_sync/test_sus_patterns/test_redos_cost_arbiter.py

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          pip install uv

      - name: Assert uv resolves the matrix interpreter (before sync)
        run: |
          uv run --no-project python -c "import os, sys; assert '%d.%d' % sys.version_info[:2] == os.environ['EXPECTED_PYTHON'], sys.version; print(sys.version)"

      - name: Install dependencies (same extras as the Dockerfile)
        run: |
          uv sync --locked --extra dev --extra otel --extra logfire

      - name: Assert the synced environment runs the matrix interpreter
        run: |
          uv run --no-sync python -c "import os, sys; assert '%d.%d' % sys.version_info[:2] == os.environ['EXPECTED_PYTHON'], sys.version; print(sys.version)"

      - name: Start a CPU burner on every core
        run: |
          : > burner_pids.txt
          for _ in $(seq 1 "$(nproc)"); do
            python3 -c "while True: pass" &
            echo $! >> burner_pids.txt
          done

      - name: Run the detection gate suite under CPU load (shard)
        shell: bash
        run: |
          # Measuring a genuinely quadratic pattern under burners is real
          # work: with the load-scaled verdict deadline the cap-aware
          # canaries legitimately take ~380s per test on a 4-core runner,
          # so this job's per-test ceiling sits above the plain gate's.
          # The ceiling guards hung tests, not load-scaled verdicts.
          REDIS_URL='redis://localhost:6379' \
          GUARD_TESTS_MAX_TEST_SECONDS=600 \
          uv run pytest -m 'redos_timing' -s -v --no-cov ${{ matrix.shard.pytest_args }} 2>&1 | tee "cpu-load-report-py${{ matrix.python-version }}-${{ matrix.shard.name }}.txt"

      - name: Stop the CPU burner
        if: always()
        run: |
          while read -r pid; do
            kill "$pid" 2>/dev/null || true
          done < burner_pids.txt

      - name: Upload the CPU-load shard report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cpu-load-report-py${{ matrix.python-version }}-${{ matrix.shard.name }}
          path: "cpu-load-report-py${{ matrix.python-version }}-${{ matrix.shard.name }}.txt"
          if-no-files-found: ignore

  detection-gate-cpu-load:
    name: detection-gate-cpu-load
    needs: [changes, detection-gate-cpu-load-shards]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Require every gating job
        if: always()
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::changes: $CHANGES_RESULT"
            exit 1
          fi
          case "$CODE" in
            true) accepted='["success"]' ;;
            false) accepted='["success","skipped"]' ;;
            *) echo "::error::changes output code is '$CODE', expected true or false"; exit 1 ;;
          esac
          bad="$(jq -r --argjson ok "$accepted" 'del(.changes) | to_entries[] | select(.value.result as $r | $ok | index($r) | not) | "\(.key)=\(.value.result)"' <<< "$NEEDS")"
          if [ -n "$bad" ]; then
            echo "::error::not green: $bad"
            exit 1
          fi
          echo "every gating job is green (code=$CODE)"

  detection-corpus:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      # uv follows .python-version (3.10) unless told otherwise.
      UV_PYTHON: ${{ matrix.python-version }}
      UV_PYTHON_DOWNLOADS: never
      EXPECTED_PYTHON: ${{ matrix.python-version }}

    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          pip install uv

      - name: Check out base tree at merge-base
        run: |
          git fetch origin master
          base_sha=$(git merge-base HEAD origin/master)
          echo "base_sha=$base_sha"
          git worktree add /tmp/base-tree "$base_sha"

      - name: Assert uv resolves the matrix interpreter (before sync)
        run: |
          uv run --no-project python -c "import os, sys; assert '%d.%d' % sys.version_info[:2] == os.environ['EXPECTED_PYTHON'], sys.version; print(sys.version)"

      - name: Install dependencies
        run: |
          uv sync --locked --extra dev --extra otel --extra logfire

      - name: Assert the synced environment runs the matrix interpreter
        run: |
          uv run --no-sync python -c "import os, sys; assert '%d.%d' % sys.version_info[:2] == os.environ['EXPECTED_PYTHON'], sys.version; print(sys.version)"

      - name: Print guard_core.__file__ (candidate)
        run: |
          uv run python -c "import guard_core; print(guard_core.__file__)"

      - name: Measure candidate corpus
        run: |
          uv run python tests/detection_gate/defect_corpus.py "$PWD" "/tmp/base-tree" > dc_cand.json

      - name: Measure base corpus
        run: |
          uv run python tests/detection_gate/defect_corpus.py "/tmp/base-tree" "/tmp/base-tree" > dc_base.json

      - name: Run the detection corpus gate
        shell: bash
        run: |
          set -o pipefail
          uv run python tests/detection_gate/gate.py dc_base.json dc_cand.json "$PWD" 2>&1 | tee gate-output.txt

      - name: Upload gate artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: detection-corpus-gate-py${{ matrix.python-version }}
          path: |
            dc_base.json
            dc_cand.json
            gate-output.txt
