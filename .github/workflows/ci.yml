name: CI

on:
  push:
    branches:
      - master
    paths:
      - 'compose.yml'
      - 'data/**'
      - 'Dockerfile'
      - 'guard_core/**'
      - 'mypy.ini'
      - '.github/**'
      - '.pre-commit-config.yaml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'pytest.ini'
      - 'reqs.pip'
      - 'tests/**'
  pull_request:
    branches:
      - master
    paths:
      - 'compose.yml'
      - 'data/**'
      - 'Dockerfile'
      - 'guard_core/**'
      - 'mypy.ini'
      - '.github/**'
      - '.pre-commit-config.yaml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'pytest.ini'
      - 'reqs.pip'
      - 'tests/**'
  workflow_dispatch:
  # release.yml calls this file so the release gate is the PR gate, never a copy of it.
  workflow_call:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Tooling job with no test run: 3.10 is the floor the lint and type config targets (mypy python_version 3.10); the test matrix owns the other versions.
          python-version: '3.10'
      - run: pip install uv
      - run: uv sync --locked --extra dev --extra otel --extra logfire
      - name: Check uv.lock is tracked and in sync
        run: |
          test "$(git ls-files uv.lock)" = "uv.lock"
          rc=0
          git check-ignore -q uv.lock || rc=$?
          test "$rc" -eq 1
          uv lock --check
      - name: Test the lock scripts
        run: uv run --no-sync pytest .github/scripts/tests --no-cov -p no:cacheprovider
      - run: uv run pre-commit run --all-files

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Tooling job with no test run: 3.10 is the floor the lint and type config targets (mypy python_version 3.10); the test matrix owns the other versions.
          python-version: '3.10'
      - run: pip install uv
      - run: uv sync --locked --extra dev --extra otel --extra logfire
      - run: make quality

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Packaging check only (the sdist is pure Python); the test matrix owns the other versions.
          python-version: '3.10'
      - run: pip install uv
      - run: uv build --sdist --out-dir dist
      - run: python scripts/check_sdist_contents.py dist/*.tar.gz

  test:
    name: test (${{ matrix.python-version }}${{ matrix.informational && ', informational' || '' }})
    continue-on-error: ${{ matrix.informational == true }}
    env:
      # uv follows .python-version (3.10) unless told otherwise, so the matrix CPython was set up and never used.
      UV_PYTHON: ${{ matrix.python-version }}
      UV_PYTHON_DOWNLOADS: never
      EXPECTED_PYTHON: ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    permissions:
      pull-requests: write

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          # Informational until pydantic-core ships a 3.15 wheel (LEDGER 6.69): a red 3.15 job never fails the run.
          - python-version: '3.15'
            informational: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install uv
        run: |
          pip install uv

      - name: Assert uv resolves the matrix interpreter (before sync)
        run: |
          uv run --no-project python -c "import os, sys; assert '%d.%d' % sys.version_info[:2] == os.environ['EXPECTED_PYTHON'], sys.version; print(sys.version)"

      - name: Install dependencies
        run: |
          uv sync --locked --extra dev --extra otel --extra logfire

      - name: Assert the synced environment runs the matrix interpreter
        run: |
          uv run --no-sync python -c "import os, sys; assert '%d.%d' % sys.version_info[:2] == os.environ['EXPECTED_PYTHON'], sys.version; print(sys.version)"

      - name: Run tests
        run: |
          COVERAGE_FILE=coverage-py${{ matrix.python-version }}.data IPINFO_TOKEN='${{ secrets.IPINFO_TOKEN || 'test_token' }}' REDIS_URL='redis://localhost:6379' GUARD_TESTS_MAX_TEST_SECONDS=180 uv run pytest -v --cov=guard_core -W error

      - name: Upload coverage data
        if: ${{ !matrix.informational }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-py${{ matrix.python-version }}
          path: coverage-py${{ matrix.python-version }}.data
          if-no-files-found: error

  coverage:
    name: coverage (combined across the matrix)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # The reporter only reads the data files and the checked-out sources; it does not run the tests.
          python-version: '3.10'

      - name: Install coverage
        run: |
          pip install coverage

      - name: Download every version's coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-data-py*
          path: coverage-data
          merge-multiple: true

      - name: Require the data of every matrix version
        run: |
          for v in 3.10 3.11 3.12 3.13 3.14; do
            test -f "coverage-data/coverage-py$v.data" || { echo "::error::no coverage data for Python $v"; exit 1; }
          done

      - name: Combine and gate
        run: |
          coverage combine coverage-data/coverage-py*.data
          coverage report -m --fail-under=100

  docker-test:
    name: docker-test (${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    permissions:
      pull-requests: write

    # The docker suite runs ~29-30 minutes of pytest after a cold bake,
    # so a 30 minute job cap kills the job right after the tests pass.
    timeout-minutes: 50

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Assert the image environment runs the matrix interpreter
        run: |
          COMPOSE_BAKE=true PYTHON_VERSION=${{ matrix.python-version }} docker compose run --rm --build -e EXPECTED_PYTHON=${{ matrix.python-version }} guard-core python -c "import os, sys; assert '%d.%d' % sys.version_info[:2] == os.environ['EXPECTED_PYTHON'], sys.version; print(sys.version)"

      # The 100 percent gate lives in the combined coverage job: a version branch (for example
      # _redos_parse_slots.py) is covered by only some interpreters, so no single version reaches 100.
      - name: Run tests in Docker
        run: |
          PYTHON_VERSION=${{ matrix.python-version }} docker compose run --rm -e GUARD_TESTS_MAX_TEST_SECONDS=180 guard-core pytest -q -p no:cacheprovider -W error --ignore=tests/live_smoke --cov=guard_core --cov-branch

      - name: Tear down Docker Compose
        if: always()
        run: |
          docker compose down -v --remove-orphans
