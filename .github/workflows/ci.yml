name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
  # release.yml calls this file so the release gate is the PR gate, never a copy of it.
  workflow_call:
    secrets:
      IPINFO_TOKEN:
        required: false

permissions:
  contents: read # check out the repository

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # pull_request checks out the merge commit; the second commit is the base (its first parent).
          fetch-depth: 2

      - name: Decide whether any code path changed
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # On pull_request the checkout is the merge commit: HEAD^1 is the base, so a depth-1 clone cannot answer.
          if ! files="$(git diff --name-only HEAD^1 HEAD)"; then
            echo "::error::cannot diff HEAD^1 HEAD (shallow or non-merge checkout), refusing to guess"
            exit 1
          fi
          code=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              docs/*|mkdocs.yml|.github/ISSUE_TEMPLATE/*) ;;
              */*) code=true; echo "code path: $f" ;;
              *.md|LICENSE) ;;
              *) code=true; echo "code path: $f" ;;
            esac
          done <<< "$files"
          echo "changed files: $(printf '%s' "$files" | wc -l | tr -d ' ')"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Tooling job with no test run: pre-commit and the lock tools need Python 3.11 (filelock 4.2.1, D-164), and mypy keeps python_version 3.10 in pyproject.toml; the test matrix owns the other versions.
          python-version: '3.11'
      - run: pip install uv==0.13.4
      - run: uv sync --locked --extra dev --extra otel --extra logfire
      - name: Check uv.lock is tracked and in sync
        run: |
          test "$(git ls-files uv.lock)" = "uv.lock"
          rc=0
          git check-ignore -q uv.lock || rc=$?
          test "$rc" -eq 1
          uv lock --check
      - name: Test the lock scripts
        run: uv run --no-sync pytest .github/scripts/tests --no-cov -p no:cacheprovider
      - run: uv run pre-commit run --all-files

  quality:
    name: quality
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: '3.10'
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Tooling job with no test run: 3.10 is the floor the lint and type config targets (mypy python_version 3.10); the test matrix owns the other versions.
          python-version: '3.10'
      - run: pip install uv==0.13.4
      - run: uv sync --locked --extra dev --extra otel --extra logfire
      - run: make quality

  sdist:
    name: sdist
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: '3.10'
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Packaging check only (the sdist is pure Python); the test matrix owns the other versions.
          python-version: '3.10'
      - run: pip install uv==0.13.4
      - run: uv build --sdist --out-dir dist
      - run: python scripts/check_sdist_contents.py dist/*.tar.gz

  test:
    name: test (${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    env:
      # uv follows .python-version (3.11) unless told otherwise, so the matrix CPython was set up and never used.
      UV_PYTHON: ${{ matrix.python-version }}
      UV_PYTHON_DOWNLOADS: never
      EXPECTED_PYTHON: ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:8.10.3@sha256:de1068af6f552240dfab67bcc9bfef99bfc60f776bb4580ef077ea4c8c97e848
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    permissions:
      contents: read # check out the repository (the job calls no pull request API)

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          pip install uv==0.13.4

      - name: Assert uv resolves the matrix interpreter (before sync)
        run: |
          uv run --no-project python -c "import os, sys; assert '%d.%d' % sys.version_info[:2] == os.environ['EXPECTED_PYTHON'], sys.version; print(sys.version)"

      - name: Install dependencies
        run: |
          uv sync --locked --extra dev --extra otel --extra logfire

      - name: Assert the synced environment runs the matrix interpreter
        run: |
          uv run --no-sync python -c "import os, sys; assert '%d.%d' % sys.version_info[:2] == os.environ['EXPECTED_PYTHON'], sys.version; print(sys.version)"

      - name: Run tests
        run: |
          COVERAGE_FILE=coverage-py${MATRIX_PYTHON_VERSION}.data IPINFO_TOKEN="${IPINFO_TOKEN}" REDIS_URL='redis://localhost:6379' GUARD_TESTS_MAX_TEST_SECONDS=180 uv run pytest -v --cov=guard_core -W error
        env:
          MATRIX_PYTHON_VERSION: ${{ matrix.python-version }}
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN || 'test_token' }}

      - name: Upload coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data-py${{ matrix.python-version }}
          path: coverage-py${{ matrix.python-version }}.data
          if-no-files-found: error

  test-lowest-direct:
    name: test-lowest-direct (${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    env:
      # uv follows .python-version (3.11) unless told otherwise, so the matrix CPython was set up and never used.
      UV_PYTHON: ${{ matrix.python-version }}
      UV_PYTHON_DOWNLOADS: never
      EXPECTED_PYTHON: ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:8.10.3@sha256:de1068af6f552240dfab67bcc9bfef99bfc60f776bb4580ef077ea4c8c97e848
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    permissions:
      contents: read # check out the repository (the job calls no pull request API)

    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          pip install uv==0.13.4

      - name: Assert uv resolves the matrix interpreter (before sync)
        run: |
          uv run --no-project python -c "import os, sys; assert '%d.%d' % sys.version_info[:2] == os.environ['EXPECTED_PYTHON'], sys.version; print(sys.version)"

      - name: Install dependencies
        run: |
          uv sync --locked --extra dev --extra otel --extra logfire

      - name: Assert the synced environment runs the matrix interpreter
        run: |
          uv run --no-sync python -c "import os, sys; assert '%d.%d' % sys.version_info[:2] == os.environ['EXPECTED_PYTHON'], sys.version; print(sys.version)"

      - name: Install the shipped dependencies at their declared floors
        run: |
          uv pip compile pyproject.toml --extra otel --extra logfire --extra redis --extra cloud --extra geo --resolution lowest-direct --python-version "$MATRIX_PYTHON_VERSION" --no-emit-package guard-agent --no-emit-package fastapi-guard --no-header --generate-hashes -o floors.txt
          uv pip install --require-hashes -r floors.txt
        env:
          MATRIX_PYTHON_VERSION: ${{ matrix.python-version }}

      - name: Run tests
        run: |
          COVERAGE_FILE=coverage-lowest-direct-py${MATRIX_PYTHON_VERSION}.data IPINFO_TOKEN="${IPINFO_TOKEN}" REDIS_URL='redis://localhost:6379' GUARD_TESTS_MAX_TEST_SECONDS=180 uv run --no-sync pytest -v --cov=guard_core -W error
        env:
          MATRIX_PYTHON_VERSION: ${{ matrix.python-version }}
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN || 'test_token' }}

  test-redis-floor:
    name: test (redis-py ${{ matrix.redis-py }}, ${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      UV_PYTHON_DOWNLOADS: never
      EXPECTED_PYTHON: ${{ matrix.python-version }}
      REDIS_PY: ${{ matrix.redis-py }}
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:8.10.3@sha256:de1068af6f552240dfab67bcc9bfef99bfc60f776bb4580ef077ea4c8c97e848
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    permissions:
      contents: read # check out the repository (the job calls no pull request API)

    strategy:
      fail-fast: false
      matrix:
        # D-244: the redis extra admits 4.4.4 on, so the suite runs at the floor on the oldest and the newest Python, and at the releases the fast path treats differently (5.0.1: no Connection._close before 5.0.2; 5.3.1: the first with the release event; 6.2.0; 6.4.0: kombu and celery users; 7.3.0: the wait recorder without the count recorder).
        include:
          - {redis-py: '4.4.4', python-version: '3.10'}
          - {redis-py: '4.4.4', python-version: '3.15'}
          - {redis-py: '5.0.1', python-version: '3.10'}
          - {redis-py: '5.3.1', python-version: '3.10'}
          - {redis-py: '6.2.0', python-version: '3.10'}
          - {redis-py: '6.4.0', python-version: '3.10'}
          - {redis-py: '7.3.0', python-version: '3.10'}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          pip install uv==0.13.4

      - name: Install dependencies
        run: |
          uv sync --locked --extra dev --extra otel --extra logfire

      - name: Install redis-py 4.4.4
        if: matrix.redis-py == '4.4.4'
        run: |
          uv pip install redis==4.4.4

      - name: Install redis-py 5.0.1
        if: matrix.redis-py == '5.0.1'
        run: |
          uv pip install redis==5.0.1

      - name: 'Install redis-py 5.3.1 (PyJWT 2.15.0, the first with no advisory: redis-py 5.3.0 alone pins 2.9.0)'
        if: matrix.redis-py == '5.3.1'
        run: |
          uv pip install redis==5.3.1 PyJWT==2.15.0

      - name: Install redis-py 6.2.0
        if: matrix.redis-py == '6.2.0'
        run: |
          uv pip install redis==6.2.0 PyJWT==2.15.0

      - name: Install redis-py 6.4.0
        if: matrix.redis-py == '6.4.0'
        run: |
          uv pip install redis==6.4.0 PyJWT==2.15.0

      - name: Install redis-py 7.3.0
        if: matrix.redis-py == '7.3.0'
        run: |
          uv pip install redis==7.3.0 PyJWT==2.15.0

      - name: Assert the redis-py under test is the one installed
        run: |
          uv run --no-sync python -c "import os, redis; assert redis.__version__ == os.environ['REDIS_PY'], redis.__version__; print(redis.__version__)"

      - name: Run tests at this redis-py (-W error, 100% branch coverage)
        run: |
          COVERAGE_FILE=coverage-redis-py${REDIS_PY}.data IPINFO_TOKEN="${IPINFO_TOKEN}" REDIS_URL='redis://localhost:6379' GUARD_TESTS_MAX_TEST_SECONDS=180 uv run --no-sync pytest -v --cov=guard_core --cov-branch --cov-fail-under=100 -W error
        env:
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN || 'test_token' }}

  coverage:
    name: coverage (combined across the matrix)
    needs: [changes, test]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # The reporter only reads the data files and the checked-out sources; it does not run the tests.
          python-version: '3.10'

      - name: Install uv
        run: |
          pip install uv==0.13.4

      # The test jobs' own environment: its coverage version and the project's coverage configuration
      # (plain coverage on 3.10 reads no pyproject.toml without the toml extra).
      - name: Install dependencies
        env:
          UV_PYTHON: '3.10'
          UV_PYTHON_DOWNLOADS: never
        run: |
          uv sync --locked --extra dev --extra otel --extra logfire

      - name: Show the coverage configuration the combine reads
        run: |
          uv run --no-sync coverage debug config

      - name: Download every version's coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-data-py*
          path: coverage-data
          merge-multiple: true

      - name: Require the data of every matrix version
        run: |
          for v in 3.10 3.11 3.12 3.13 3.14 3.15; do
            test -f "coverage-data/coverage-py$v.data" || { echo "::error::no coverage data for Python $v"; exit 1; }
          done

      - name: Combine and gate
        run: |
          uv run --no-sync coverage combine coverage-data/coverage-py*.data
          uv run --no-sync coverage report -m --fail-under=100

  docker-test-py:
    name: docker-test-py (${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']

    permissions:
      contents: read # check out the repository (the job calls no pull request API)

    # The docker suite runs ~29-30 minutes of pytest after a cold bake,
    # so a 30 minute job cap kills the job right after the tests pass.
    timeout-minutes: 50

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assert the image environment runs the matrix interpreter
        run: |
          COMPOSE_BAKE=true PYTHON_VERSION=${MATRIX_PYTHON_VERSION} docker compose run --rm --build -e EXPECTED_PYTHON="${MATRIX_PYTHON_VERSION}" guard-core python -c "import os, sys; assert '%d.%d' % sys.version_info[:2] == os.environ['EXPECTED_PYTHON'], sys.version; print(sys.version)"
        env:
          MATRIX_PYTHON_VERSION: ${{ matrix.python-version }}

      # The 100 percent gate lives in the docker-coverage job: a version branch (for example
      # _redos_parse_slots.py) is covered by only some interpreters, so no single version reaches 100.
      - name: Run tests in Docker
        run: |
          mkdir -p coverage-docker
          PYTHON_VERSION=${MATRIX_PYTHON_VERSION} docker compose run --rm -v "$PWD/coverage-docker:/cov" -e "COVERAGE_FILE=/cov/coverage-docker-py${MATRIX_PYTHON_VERSION}.data" -e GUARD_TESTS_MAX_TEST_SECONDS=180 guard-core pytest -q -p no:cacheprovider -W error --ignore=tests/live_smoke --cov=guard_core --cov-branch
        env:
          MATRIX_PYTHON_VERSION: ${{ matrix.python-version }}

      # The udp-stub cases bind 127.0.0.1:53 and need the libc resolver pointed there, which a compose
      # network never does (it always resolves through 127.0.0.11), so they run on their own on the
      # default bridge with --dns 127.0.0.1, in the image the compose build made. The suite's Redis is the
      # one compose published on host port 6379, reached through host-gateway. A skipped case fails the step.
      - name: Run the silent-resolver geo download cases in Docker
        shell: bash
        run: |
          docker run --rm --dns 127.0.0.1 --add-host host.docker.internal:host-gateway -e REDIS_URL=redis://host.docker.internal:6379 -e GIT_OPTIONAL_LOCKS=0 -e IPINFO_TOKEN=test_token "guard-core-py${MATRIX_PYTHON_VERSION}" pytest -q -p no:cacheprovider -W error --no-cov -rs tests/test_sync/test_geo_download_setup.py | tee geo-download.out
          ! grep -q '^SKIPPED' geo-download.out
        env:
          MATRIX_PYTHON_VERSION: ${{ matrix.python-version }}

      - name: Upload the container coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data-docker-py${{ matrix.python-version }}
          path: coverage-docker/coverage-docker-py${{ matrix.python-version }}.data
          if-no-files-found: error

      - name: Tear down Docker Compose
        if: always()
        run: |
          docker compose down -v --remove-orphans

  docker-coverage:
    name: docker-coverage (combined across the container matrix)
    needs: [changes, docker-test-py]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # The reporter only reads the data files and the checked-out sources; it does not run the tests.
          python-version: '3.10'

      - name: Install uv
        run: |
          pip install uv==0.13.4

      - name: Install dependencies
        env:
          UV_PYTHON: '3.10'
          UV_PYTHON_DOWNLOADS: never
        run: |
          uv sync --locked --extra dev --extra otel --extra logfire

      - name: Download every version's container coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-data-docker-py*
          path: coverage-data
          merge-multiple: true

      - name: Require the data of every container version
        run: |
          for v in 3.10 3.11 3.12 3.13 3.14 3.15; do
            test -f "coverage-data/coverage-docker-py$v.data" || { echo "::error::no container coverage data for Python $v"; exit 1; }
          done

      # The container recorded /app/guard_core, the checkout holds guard_core: one source tree for the combine.
      - name: Write the path mapping
        run: |
          printf '[paths]\nsource =\n    guard_core\n    /app/guard_core\n' > coverage-docker.rc

      - name: Combine and gate
        run: |
          uv run --no-sync coverage combine --rcfile=coverage-docker.rc coverage-data/coverage-docker-py*.data
          uv run --no-sync coverage report --rcfile=coverage-docker.rc -m --fail-under=100

  docker-test:
    name: docker-test
    needs: [changes, docker-test-py, docker-coverage]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every gating job
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::changes: $CHANGES_RESULT"
            exit 1
          fi
          case "$CODE" in
            true) accepted='["success"]' ;;
            false) accepted='["success","skipped"]' ;;
            *) echo "::error::changes output code is '$CODE', expected true or false"; exit 1 ;;
          esac
          bad="$(jq -r --argjson ok "$accepted" 'del(.changes) | to_entries[] | select(.value.result as $r | $ok | index($r) | not) | "\(.key)=\(.value.result)"' <<< "$NEEDS")"
          if [ -n "$bad" ]; then
            echo "::error::not green: $bad"
            exit 1
          fi
          echo "every gating job is green (code=$CODE)"

  semgrep:
    name: semgrep
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Tooling job with no test run: the locked Semgrep project (tools/semgrep) needs Python 3.10 or newer; the test matrix owns the other versions.
          python-version: '3.11'
      - run: pip install uv==0.13.4
      # Rules come from the committed snapshot and findings from tools/semgrep/reviewed.json (LEDGER 6.581, D-252): no registry fetch, an unreviewed finding or an expired entry fails.
      - run: make semgrep

  ci:
    name: ci
    needs: [changes, pre-commit, quality, sdist, test, test-redis-floor, coverage, docker-test-py, docker-coverage, docker-test, test-lowest-direct, semgrep]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every gating job
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::changes: $CHANGES_RESULT"
            exit 1
          fi
          case "$CODE" in
            true) accepted='["success"]' ;;
            false) accepted='["success","skipped"]' ;;
            *) echo "::error::changes output code is '$CODE', expected true or false"; exit 1 ;;
          esac
          bad="$(jq -r --argjson ok "$accepted" 'del(.changes) | to_entries[] | select(.value.result as $r | $ok | index($r) | not) | "\(.key)=\(.value.result)"' <<< "$NEEDS")"
          if [ -n "$bad" ]; then
            echo "::error::not green: $bad"
            exit 1
          fi
          echo "every gating job is green (code=$CODE)"
