name: CI

on:
  push:
    branches:
      - master
    paths:
      - 'compose.yml'
      - 'data/**'
      - 'Dockerfile'
      - 'guard_core/**'
      - 'mypy.ini'
      - '.github/**'
      - '.pre-commit-config.yaml'
      - 'pyproject.toml'
      - 'pytest.ini'
      - 'reqs.pip'
      - 'tests/**'
  pull_request:
    branches:
      - master
    paths:
      - 'compose.yml'
      - 'data/**'
      - 'Dockerfile'
      - 'guard_core/**'
      - 'mypy.ini'
      - '.github/**'
      - '.pre-commit-config.yaml'
      - 'pyproject.toml'
      - 'pytest.ini'
      - 'reqs.pip'
      - 'tests/**'
  workflow_dispatch:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - run: pip install uv
      - run: uv sync --extra dev --extra otel --extra logfire
      - run: uv run pre-commit run --all-files

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - run: pip install uv
      - run: uv sync --extra dev --extra otel --extra logfire
      - run: make quality

  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    permissions:
      pull-requests: write

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          pip install uv

      - name: Install dependencies
        run: |
          uv sync --extra dev --extra otel --extra logfire

      - name: Run tests
        run: |
          IPINFO_TOKEN='${{ secrets.IPINFO_TOKEN || 'test_token' }}' REDIS_URL='redis://localhost:6379' GUARD_TESTS_MAX_TEST_SECONDS=180 uv run pytest -v --cov=guard_core --cov-fail-under=100 -W error

  docker-test:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write

    # The 3.10 docker suite runs ~29-30 minutes of pytest after a cold bake,
    # so a 30 minute job cap kills the job right after the tests pass.
    timeout-minutes: 50

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run tests in Docker
        run: |
          COMPOSE_BAKE=true PYTHON_VERSION=3.10 docker compose run --rm --build -e GUARD_TESTS_MAX_TEST_SECONDS=180 guard-core pytest -q -p no:cacheprovider -W error --ignore=tests/live_smoke --cov=guard_core --cov-branch --cov-fail-under=100

      - name: Tear down Docker Compose
        if: always()
        run: |
          docker compose down -v --remove-orphans
