[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["specs/fixtures/tools"]
python_files = ["test_*.py"]
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=guard_core --cov-branch --cov-report=term-missing -m 'not integration and not redos_timing'"
filterwarnings = ["error"]
markers = [
    "asyncio: mark tests as async",
    "integration: marks tests that require Docker + external services (deselect with '-m \"not integration\"')",
    "redos_timing: real regex timing via subprocess; slow, run in the detection gate, not the coverage matrix",
]

[tool.mypy]
python_version = "3.10"
mypy_path = "specs/fixtures/tools"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
exclude = [
    "vulture_whitelist.py",
    ".venv",
    "\\.unasync_check_tmp_",
    "tests/live_smoke/stack/app",
    "tests/typing_fixtures/expect_error",
]

