enabled = false

[tool.pymarkdown.plugins.md046]
enabled = false

[tool.pymarkdown.plugins.md029]
enabled = false

[tool.vulture]
paths = ["guard_core", "tests", "vulture_whitelist.py"]
exclude = ["**/conftest.py", ".venv", "tests/live_smoke/stack/app"]
min_confidence = 100
ignore_decorators = [
    "@app.route",
    "@app.get",
    "@app.post",
    "@app.put",
    "@app.delete",
    "@app.patch",
    "@pytest.fixture",
    "@pytest.mark.*",
    "@validator",
    "@root_validator",
    "@field_validator",
    "@model_validator",
]
ignore_names = [
    "test_*",
    "Test*",
    "cleanup_*",
    "mock_*",
    "expected_*",
    "exc_*",
    "__*__",
    "Config",
    "Field",
]
sort_by_size = true

[tool.bandit]
skips = ["B101", "B601", "B403", "B404", "B603"]
exclude_dirs = ["tests", ".venv", "vulture_whitelist.py"]

[tool.radon]
exclude = "tests/*,.venv/*,vulture_whitelist.py"
cc_min = "C"
mi_min = "A"
no_assert = false
show_closures = true
total_average = true

[tool.xenon]
max_absolute = "B"
max_modules = "A"
max_average = "A"
exclude = ["tests/*", ".venv/*", "vulture_whitelist.py"]
ignore = []

[tool.uv]
exclude-newer = "7 days"
override-dependencies = ["filelock>=4.2.1"]

[tool.uv.exclude-newer-package]
guard-agent = "0 days"
virtualenv = "2026-10-23T00:00:00Z"

[tool.deptry]
extend_exclude = ['vulture_whitelist\.py', 'docs', 'conftest\.py', '\.claude', 'interop']
known_first_party = ["guard_core", "run_fixtures"]
per_rule_ignores = { "DEP002" = [
    "bandit",
    "deptry",
    "guard-agent",
    "mkdocs",
    "mkdocstrings",
    "mkdocstrings-python",
    "mike",
    "mkdocs-material",
    "build",
    "mypy",
    "pip-audit",
    "pre-commit",
    "pymarkdownlnt",
    "yq",
    "pyopenssl",
    "pysocks",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-mock",
    "radon",
    "ruff",
    "safety",
    "semgrep",
    "testcontainers",
    "types-cachetools",
    "types-requests",
    "vulture",
    "xenon",
], "DEP001" = [
    "events_cases",
    "events_harness",
    "pipeline_cases",
    "pipeline_harness",
    "redis_interop_cases",
], "DEP003" = [
    "guard-agent",
] }

[tool.deptry.package_module_name_map]
opentelemetry-sdk = "opentelemetry"
opentelemetry-exporter-otlp-proto-http = "opentelemetry"
