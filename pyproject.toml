[project]
name = "guard-core"
version = "4.4.0"
description = "Framework-agnostic security engine for the Guard ecosystem."
authors = [
    {name = "Renzo Franceschini", email = "rennf93@guard-core.com"}
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.16"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "cachetools",
    "pydantic",
    "pydantic-core",
    "typing-extensions",
    "urllib3>=2.7.0",
]

[project.urls]
Homepage = "https://github.com/Guard-Core/guard-core"
Repository = "https://github.com/Guard-Core/guard-core"
Documentation = "https://guard-core.github.io/guard-core/latest/"
Issues = "https://github.com/Guard-Core/guard-core/issues"
Changelog = "https://github.com/Guard-Core/guard-core/blob/master/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "aiohttp",
    "bandit[toml]",
    "deptry",
    "guard-agent",
    "maxminddb",
    "mypy",
    "pip-audit; python_version >= '3.11'",
    "pre-commit; python_version >= '3.11'",
    "pyopenssl",
    "pysocks",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-mock",
    "radon",
    "redis",
    "requests",
    "ruff==0.17.1",
    "safety; python_version >= '3.11'",
    "testcontainers",
    "types-cachetools",
    "types-requests",
    "vulture",
    "xenon",
]
otel = [
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
]
logfire = [
    "logfire",
]
redis = [
    "redis",
]
cloud = [
    "aiohttp>=3.13.3",
    "requests",
    "urllib3>=2.7.0",
]
geo = [
    "aiohttp>=3.13.3",
    "maxminddb",
    "requests",
]

[dependency-groups]
release = [
    "build",
]
docs = [
    "mike",
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings",
    "mkdocstrings-python",
    "pymarkdownlnt",
    "yq",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["guard_core"]

[tool.hatch.build.targets.sdist]
include = ["/guard_core", "/LICENSE", "/README.md", "/pyproject.toml"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
target-version = "py310"
exclude = ["vulture_whitelist.py", ".venv", "CLAUDE.md", "tests/live_smoke/stack/app"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "UP",
    "B",
    "I",
    "ANN401",
]

