[project]
name = "guard-core"
version = "5.0.0"
description = "Framework-agnostic security engine for the Guard ecosystem."
authors = [
    {name = "Renzo Franceschini", email = "rennf93@guard-core.com"}
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.16"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "cachetools>=5.0.0",
    "pydantic>=2.12.0",
    "pydantic-core>=2.41.1",
    "tzdata>=2023.3",
    "typing-extensions>=4.14.1",
    "urllib3>=2.8.0",
]

[project.urls]
Homepage = "https://github.com/Guard-Core/guard-core"
Repository = "https://github.com/Guard-Core/guard-core"
Documentation = "https://guard-core.github.io/guard-core/latest/"
Issues = "https://github.com/Guard-Core/guard-core/issues"
Changelog = "https://github.com/Guard-Core/guard-core/blob/master/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "aiohttp",
    "bandit[toml]",
    "deptry",
    "guard-agent",
    "maxminddb",
    "mypy",
    "pip-audit; python_version >= '3.11'",
    "pre-commit; python_version >= '3.11'",
    "pyopenssl",
    "pysocks",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-mock",
    "radon",
    "redis>=4.4.4,!=4.5.0,!=4.5.1,!=4.5.2,!=4.5.3,!=5.3.0",
    "requests",
    "ruff==0.17.1",
    "safety; python_version >= '3.11'",
    "testcontainers",
    "types-cachetools",
    "types-requests",
    "vulture",
    "xenon",
]
otel = [
    "opentelemetry-sdk>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
]
logfire = [
    "logfire>=5.2.0",
]
redis = [
    "redis>=4.4.4,!=4.5.0,!=4.5.1,!=4.5.2,!=4.5.3,!=5.3.0",
]
cloud = [
    "aiohttp>=3.14.4",
    "requests>=2.33.0",
    "urllib3>=2.8.0",
]
geo = [
    "aiohttp>=3.14.4",
    "maxminddb>=2.0.1",
    "requests>=2.33.0",
]

[dependency-groups]
release = [
    "build",
]
docs = [
    "mike",
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings",
    "mkdocstrings-python",
    "pymarkdownlnt",
    "yq",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["guard_core"]

[tool.hatch.build.targets.sdist]
include = ["/guard_core", "/LICENSE", "/README.md", "/pyproject.toml"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
target-version = "py310"
exclude = ["vulture_whitelist.py", ".venv", "CLAUDE.md", "tests/live_smoke/stack/app"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "UP",
    "B",
    "I",
    "ANN401",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["specs/fixtures/tools"]
python_files = ["test_*.py"]
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=guard_core --cov-branch --cov-report=term-missing -m 'not integration and not redos_timing'"
filterwarnings = ["error"]
markers = [
    "asyncio: mark tests as async",
    "integration: marks tests that require Docker + external services (deselect with '-m \"not integration\"')",
    "redos_timing: real regex timing via subprocess; slow, run in the detection gate, not the coverage matrix",
]

[tool.mypy]
python_version = "3.10"
mypy_path = "specs/fixtures/tools"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
exclude = [
    "vulture_whitelist.py",
    ".venv",
    "\\.unasync_check_tmp_",
    "tests/live_smoke/stack/app",
    "tests/typing_fixtures/expect_error",
    "perf_gate/multipart_cells.py",
]

# D-177 Any ratchet: begin (generated list; WP143 ratchet, shrink it, never grow it; tests/test_any_ratchet.py holds the line)
[[tool.mypy.overrides]]
module = "guard_core.*"
disallow_any_explicit = true

# D-177 Any ratchet: end

[[tool.mypy.overrides]]
module = "redis.*"
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "guard_agent"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "guard_agent.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "guard_core.sync.*"
disable_error_code = ["arg-type", "return-value", "assignment"]

[[tool.mypy.overrides]]
module = "opentelemetry.*"
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "logfire"
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "radon.*"
ignore_missing_imports = true

[tool.pymarkdown.system]
exclude_path = ".venv,.git,.github,data,tests,.claude,CLAUDE.md,.cursor,.kiro,ZZZ"

[tool.pymarkdown.plugins.md003]
enabled = false

[tool.pymarkdown.plugins.md022]
enabled = false

[tool.pymarkdown.plugins.md032]
enabled = false

[tool.pymarkdown.plugins.md007]
enabled = true
indent = 2

[tool.pymarkdown.plugins.md012]
enabled = true
maximum = 2

[tool.pymarkdown.plugins.md013]
enabled = false

[tool.pymarkdown.plugins.md024]
enabled = true
siblings_only = true

[tool.pymarkdown.plugins.md033]
enabled = false

[tool.pymarkdown.plugins.md035]
enabled = false

[tool.pymarkdown.plugins.md041]
enabled = false

[tool.pymarkdown.plugins.md046]
enabled = false

[tool.pymarkdown.plugins.md029]
enabled = false

[tool.vulture]
paths = ["guard_core", "tests", "vulture_whitelist.py"]
exclude = ["**/conftest.py", ".venv", "tests/live_smoke/stack/app"]
min_confidence = 100
ignore_decorators = [
    "@app.route",
    "@app.get",
    "@app.post",
    "@app.put",
    "@app.delete",
    "@app.patch",
    "@pytest.fixture",
    "@pytest.mark.*",
    "@validator",
    "@root_validator",
    "@field_validator",
    "@model_validator",
]
ignore_names = [
    "test_*",
    "Test*",
    "cleanup_*",
    "mock_*",
    "expected_*",
    "exc_*",
    "__*__",
    "Config",
    "Field",
]
sort_by_size = true

[tool.bandit]
skips = ["B101", "B601", "B403", "B404", "B603"]
exclude_dirs = ["tests", ".venv", "vulture_whitelist.py"]

[tool.radon]
exclude = "tests/*,.venv/*,vulture_whitelist.py"
cc_min = "C"
mi_min = "A"
no_assert = false
show_closures = true
total_average = true

[tool.xenon]
max_absolute = "B"
max_modules = "A"
max_average = "A"
exclude = ["tests/*", ".venv/*", "vulture_whitelist.py"]
ignore = []

[tool.uv]
exclude-newer = "7 days"
override-dependencies = ["filelock>=4.2.1"]

[tool.uv.exclude-newer-package]
guard-agent = "0 days"
virtualenv = "2026-10-23T00:00:00Z"

[tool.deptry]
extend_exclude = ['vulture_whitelist\.py', 'docs', 'conftest\.py', '\.claude', 'interop']
known_first_party = ["guard_core", "run_fixtures"]
per_rule_ignores = { "DEP002" = [
    "tzdata",
    "bandit",
    "deptry",
    "guard-agent",
    "mkdocs",
    "mkdocstrings",
    "mkdocstrings-python",
    "mike",
    "mkdocs-material",
    "build",
    "mypy",
    "pip-audit",
    "pre-commit",
    "pymarkdownlnt",
    "yq",
    "pyopenssl",
    "pysocks",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-mock",
    "radon",
    "ruff",
    "safety",
    "semgrep",
    "testcontainers",
    "types-cachetools",
    "types-requests",
    "vulture",
    "xenon",
], "DEP001" = [
    "events_cases",
    "events_harness",
    "pipeline_cases",
    "pipeline_harness",
    "redis_interop_cases",
    "fastapi",
    "guard",
    "flask",
    "flaskapi_guard",
    "django",
], "DEP003" = [
    "guard-agent",
    "httpx",
] }

[tool.deptry.package_module_name_map]
opentelemetry-sdk = "opentelemetry"
opentelemetry-exporter-otlp-proto-http = "opentelemetry"
